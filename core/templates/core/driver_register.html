
<!DOCTYPE html>
<html>
<head>
    <title>Driver Registration - BookYourRide</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f0f4f8;
            display: flex;
            justify-content: center;
            padding: 30px;
        }

        .container {
            background: white;
            padding: 30px;
            width: 400px;
            border-radius: 10px;
            box-shadow: 0 0 10px #ccc;
        }

        h2 {
            text-align: center;
            color: #1d3557;
        }

        input, select {
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #1d3557;
            color: white;
            border: none;
            cursor: pointer;
            border-radius: 5px;
        }

        .errorlist {
            color: red;
        }
    </style>
</head>

<body>

<div class="container">

    <h2>Driver Registration</h2>

    <form method="POST">
        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">Register as Driver</button>
    </form>

    <p>
        Already registered?
        <a href="{% url 'login' %}">Login here</a>
    </p>

</div>

</body>
</html>
