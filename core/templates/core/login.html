
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - BookYourRide</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f0f4f8;
            margin: 0;
            padding: 30px;
        }

        .login-box {
            background: white;
            max-width: 400px;
            margin: 40px auto;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 2px 10px #ccc;
        }

        h1 {
            text-align: center;
            color: #333;
        }

        label {
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 10px;
            margin: 8px 0 15px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button {
            width: 100%;
            padding: 12px;
            background: orange;
            color: black;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background: darkorange;
        }

        .error {
            color: red;
            margin-bottom: 15px;
        }

        p {
            text-align: center;
        }

        a {
            color: #007bff;
            text-decoration: none;
        }
    </style>
</head>

<body>

    <div class="login-box">

        <h1>Login</h1>

        {% if form.errors %}
            <p class="error">
                Invalid username or password. Please try again.
            </p>
        {% endif %}

        <form method="POST" action="{% url 'login' %}">

            {% csrf_token %}

            <p>
                <label for="id_username">Username:</label>
                <input
                    type="text"
                    name="username"
                    id="id_username"
                    required
                >
            </p>

            <p>
                <label for="id_password">Password:</label>
                <input
                    type="password"
                    name="password"
                    id="id_password"
                    required
                >
            </p>

            {% if next %}
                <input type="hidden" name="next" value="{{ next }}">
            {% endif %}

            <button type="submit">Login</button>

        </form>

        <p>
            Don't have an account?
            <a href="{% url 'register' %}">Register</a>
        </p>

        <p>
            <a href="{% url 'home' %}">Back to Home</a>
        </p>

    </div>

</body>
</html>
